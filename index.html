<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Cafetería</title>
    <style>
        :root {
            --color1: #EDE4D3;
            --color2: #C9B79C;
            --color3: #9C7A54;
            --color4: #6B4F3A;
            --color5: #3E2E22;
            --danger: #b73a3a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color1);
            color: var(--color5);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(62, 46, 34, 0.15);
            border: 2px solid var(--color2);
        }

        h1, h2 { 
            color: var(--color5); 
            margin-top: 0; 
            border-bottom: 2px solid var(--color3); 
            padding-bottom: 10px; 
        }
        h2 { font-size: 1.2rem; margin-top: 25px; margin-bottom: 15px; }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            background: var(--color1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--color2);
            margin-bottom: 20px;
        }

        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 0.85em; margin-bottom: 5px; color: var(--color5); }
        
        select, input, button { 
            padding: 8px; 
            border: 1px solid var(--color3); 
            border-radius: 6px; 
            font-size: 0.95rem; 
            background-color: #ffffff;
            color: var(--color5);
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--color4);
            box-shadow: 0 0 4px rgba(107, 79, 58, 0.4);
        }

        button { cursor: pointer; font-weight: bold; }

        .btn-add { 
            background-color: var(--color4); 
            color: var(--color1); 
            border: none; 
            align-self: flex-end; 
            padding: 10px; 
        }
        .btn-add:hover { background-color: var(--color5); }
        .btn-delete { background-color: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; }
       
        .btn-pay {
            background-color: var(--color5);
            color: var(--color1);
            border: none;
            font-size: 1.1rem;
            padding: 12px 20px;
            border-radius: 6px;
        }
        .btn-pay:hover { background-color: var(--color4); }
        .btn-pay:disabled { background-color: var(--color3); cursor: not-allowed; opacity: 0.8; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9rem; }
        th, td { padding: 10px; border-bottom: 1px solid var(--color2); text-align: left; }
        th { background-color: var(--color4); color: var(--color1); }
        .text-right { text-align: right; }
        .text-center { text-align: center; }

        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color1);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--color2);
            margin-bottom: 25px;
        }

        .total-display { font-size: 1.5rem; font-weight: bold; color: var(--color5); }
        .extra-options { display: contents; }

        .inventory-section {
            background: var(--color1);
            border: 1px solid var(--color2);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .inventory-card {
            background: #ffffff;
            border: 1px solid var(--color3);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(62, 46, 34, 0.08);
        }

        .inventory-card h3 { margin: 0; font-size: 0.95rem; color: var(--color5); }

        .inventory-count {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--color4);
            text-align: center;
            margin: 4px 0;
        }

        .inventory-inputs { display: flex; gap: 6px; }

        .btn-update {
            background-color: var(--color4);
            color: var(--color1);
            border: none;
            padding: 8px;
            font-size: 0.85rem;
        }
        .btn-update:hover { background-color: var(--color5); }
        .btn-sync { background-color: var(--color3); color: white; border: none; padding: 6px 12px; border-radius: 4px; }
    </style>
</head>

    async function cargarInventarioNube() {
        document.getElementById("stockVorticeDisplay").textContent = "Cargando...";
        document.getElementById("stockCookieDisplay").textContent = "Cargando...";
        document.getElementById("stockCroissantDisplay").textContent = "Cargando...";
        document.getElementById("stockPanMuertoDisplay").textContent = "Cargando...";

        try {
            let res = await fetch(URL_GOOGLE_SHEETS, { redirect: "follow" });
            let data = await res.json();
            
            stockVortices = parseFloat(data.vortice ?? data.vortices) || 0;
            stockGalletas = parseInt(data.cookie ?? data.cookies) || 0;
            stockCroissants = parseInt(data.croissant ?? data.croissants) || 0;
            stockPanMuerto = parseInt(data.pan_muerto ?? data.panmuerto) || 0;
            renderStock();
        } catch (e) {
            console.error("Error al obtener inventario de la nube", e);
            document.getElementById("stockVorticeDisplay").textContent = "Error";
            document.getElementById("stockCookieDisplay").textContent = "Error";
            document.getElementById("stockCroissantDisplay").textContent = "Error";
            document.getElementById("stockPanMuertoDisplay").textContent = "Error";
        }
    }

    function renderStock() {
        document.getElementById("stockVorticeDisplay").textContent = `${stockVortices} porc.`;
        document.getElementById("stockCookieDisplay").textContent = `${stockGalletas} unids`;
        document.getElementById("stockCroissantDisplay").textContent = `${stockCroissants} unids`;
        document.getElementById("stockPanMuertoDisplay").textContent = `${stockPanMuerto} unids`;
    }

    async function ajustarStockNube(tipo) {
        let inputElem, nuevoValor;
        if (tipo === 'vortice') {
            inputElem = document.getElementById("inputStockVortice");
            nuevoValor = parseFloat(inputElem.value);
        } else if (tipo === 'cookie') {
            inputElem = document.getElementById("inputStockCookie");
            nuevoValor = parseInt(inputElem.value);
        } else if (tipo === 'croissant') {
            inputElem = document.getElementById("inputStockCroissant");
            nuevoValor = parseInt(inputElem.value);
        } else if (tipo === 'pan_muerto') {
            inputElem = document.getElementById("inputStockPanMuerto");
            nuevoValor = parseInt(inputElem.value);
        }

        if (isNaN(nuevoValor) || nuevoValor < 0) {
            alert("Introduce un valor numérico válido mayor o igual a 0.");
            return;
        }

        let payload = {
            accion: "actualizarStock",
            tipo: tipo,
            nuevoStock: nuevoValor
        };

        try {
            await fetch(URL_GOOGLE_SHEETS, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload),
                redirect: "follow"
            });
            
            if (tipo === 'vortice') stockVortices = nuevoValor;
            if (tipo === 'cookie') stockGalletas = nuevoValor;
            if (tipo === 'croissant') stockCroissants = nuevoValor;
            if (tipo === 'pan_muerto') stockPanMuerto = nuevoValor;

            inputElem.value = "";
            renderStock();
            alert("✅ Inventario actualizado.");
        } catch (e) {
            alert("❌ Error actualizando inventario: " + e.message);
        }
    }

    function agregarAlCarrito() {
        const prod = document.getElementById("productoSelect").value;
        const variante = document.getElementById("varianteSelect").value;
        const cantidad = parseInt(document.getElementById("cantidadInput").value);

        if (!prod || !variante || isNaN(cantidad) || cantidad <= 0) {
            alert("Por favor selecciona un producto válido y una cantidad mayor a 0.");
            return;
        }

        let precio = 0;
        let saborBase = variante;
        let tamano = "N/A";
        let fruta = "N/A";
        let toppingExtra = "N/A";

        if (prod === "Vórtice") {
            tamano = document.getElementById("vorticeTamanoSelect").value;
            precio = CATALOGO[prod][variante][tamano];
            saborBase = variante;
            fruta = document.getElementById("vorticeFrutaSelect").value;
            const helado = document.getElementById("vorticeHeladoSelect").value;
            const top = document.getElementById("vorticeToppingSelect").value;
            const topExtra = document.getElementById("vorticeToppingExtraSelect").value;

            let extrasArr = [`${helado} / Top: ${top}`];
            if (topExtra !== "Ninguno") {
                if (topExtra.includes("(+20)")) {
                    precio += 20;
                } else {
                    precio += 10;
                }
                extrasArr.push(`Extra: ${topExtra}`);
            }
            toppingExtra = extrasArr.join(" / ");

        } else if (prod === "Croissant" || prod === "Pan de Muerto") {
            precio = CATALOGO[prod][variante];
            saborBase = variante;
            fruta = document.getElementById("croissantFrutaSelect").value;
            const helado = document.getElementById("croissantHeladoSelect").value;
            const top = document.getElementById("croissantToppingSelect").value;
            const topUntado = document.getElementById("croissantToppingUntadoSelect").value;
            const topExtra = document.getElementById("croissantToppingExtraSelect").value;

            let extrasArr = [`${helado} / Top: ${top} / ${topUntado}`];
            if (topExtra !== "Ninguno") {
                if (topExtra.includes("(+20)")) {
                    precio += 20;
                } else {
                    precio += 10;
                }
                extrasArr.push(`Extra: ${topExtra}`);
            }
            toppingExtra = extrasArr.join(" / ");

        } else if (prod === "Sundae") {
            precio = CATALOGO[prod][variante];
            let topExtra = document.getElementById("sundaeToppingSelect").value;
            let extraFruta = document.getElementById("sundaeExtraFrutaSelect").value;
            let extraMermelada = document.getElementById("sundaeExtraMermeladaSelect").value;
            let extrasArray = [];

            if (!variante.includes("Especial")) {
                fruta = document.getElementById("sundaeFrutaSelect").value;
            }
            if (extraFruta !== "Ninguna") {
                precio += 10;
                extrasArray.push(`Fruta Extra: ${extraFruta} (+$10)`);
                if (fruta === "N/A" || fruta === "Sin fruta") fruta = `Fresa (Extra: ${extraFruta})`;
            }
            if (extraMermelada !== "Ninguna") {
                precio += 10;
                extrasArray.push(`Mermelada Extra: ${extraMermelada} (+$10)`);
            }
            if (topExtra !== "Ninguno") {
                precio += 10;
                extrasArray.push(`Topping: ${topExtra} (+$10)`);
            }
            toppingExtra = extrasArray.length > 0 ? extrasArray.join(" / ") : "N/A";

        } else if (prod === "Cookies Sandwich") {
            precio = CATALOGO[prod][variante];
            let topExtra = document.getElementById("cookieToppingSelect").value;
            if (topExtra !== "Ninguno") toppingExtra = `Topping: ${topExtra}`;

        } else if (prod === "Conos") {
            precio = CATALOGO[prod][variante];
            if (variante === "Especial") {
                let topExtra = document.getElementById("conoToppingSelect").value;
                if (topExtra !== "Ninguno") toppingExtra = `Topping: ${topExtra}`;
            } else {
                toppingExtra = "N/A";
            }

        } else if (prod === "Frappé") {
            tamano = document.getElementById("frappeTamanoSelect").value;
            const leche = document.getElementById("frappeLecheSelect").value;
            const crema = document.getElementById("frappeCremaSelect").value;
            const shot = document.getElementById("frappeShotSelect").value;
            precio = CATALOGO[prod][variante][tamano];
            saborBase = variante;

            let detallesExtras = [];
            if (leche === "Deslactosada" || leche === "Almendras") {
                precio += 5;
                detallesExtras.push(`Leche ${leche} (+$5)`);
            } else {
                detallesExtras.push(`Leche ${leche}`);
            }
            if (shot === "Con Shot Extra") {
                precio += 15;
                detallesExtras.push("Shot Extra Espresso (+$15)");
            }
            detallesExtras.push(crema);
            toppingExtra = detallesExtras.join(" / ");

        } else if (prod === "Bebidas Frías") {
            tamano = document.getElementById("friasTamanoSelect").value;
            const leche = document.getElementById("friasLecheSelect").value;
            const shot = document.getElementById("friasShotSelect").value;
            precio = CATALOGO[prod][variante][tamano];
            saborBase = variante;

            let detallesExtras = [];
            if (leche === "Deslactosada" || leche === "Almendras") {
                precio += 5;
                detallesExtras.push(`Leche ${leche} (+$5)`);
            } else {
                detallesExtras.push(`Leche ${leche}`);
            }
            if (shot === "Con Shot Extra") {
                precio += 15;
                detallesExtras.push("Shot Extra Espresso (+$15)");
            }
            toppingExtra = detallesExtras.join(" / ");

        } else if (prod === "Café Caliente") {
            tamano = document.getElementById("cafeTamanoSelect").value;
            const shot = document.getElementById("cafeShotSelect").value;
            const tipoAzucar = document.getElementById("cafeTipoAzucarSelect").value;
            const sobresAzucar = parseInt(document.getElementById("cafeSobresAzucarInput").value) || 0;
            const canela = document.getElementById("cafeCanelaSelect").value;

            precio = CATALOGO[prod][variante][tamano];
            saborBase = variante;

            let detallesExtras = [];
            if (variante !== "Americano") {
                const leche = document.getElementById("cafeLecheSelect").value;
                if (leche === "Deslactosada" || leche === "Almendras") {
                    precio += 5;
                    detallesExtras.push(`Leche ${leche} (+$5)`);
                } else {
                    detallesExtras.push(`Leche ${leche}`);
                }
            }

            if (shot === "Con Shot Extra") {
                precio += 15;
                detallesExtras.push("Shot Extra Espresso (+$15)");
            }
            if (tipoAzucar !== "Sin Azúcar" && sobresAzucar > 0) {
                detallesExtras.push(`${sobresAzucar} sobre(s) de azúcar ${tipoAzucar}`);
            }
            if (canela === "Con Canela") detallesExtras.push("Con Canela");
            toppingExtra = detallesExtras.length > 0 ? detallesExtras.join(" / ") : "N/A";

        } else {
            precio = CATALOGO[prod][variante];
        }

        carrito.push({
            producto: prod,
            sabor_base: saborBase,
            tamano: tamano,
            fruta: fruta,
            topping_extra: toppingExtra,
            cantidad: cantidad,
            precio: precio,
            subtotal: precio * cantidad
        });

        document.getElementById("cantidadInput").value = "1";
        renderCarrito();
    }

    function eliminarItem(index) {
        carrito.splice(index, 1);
        renderCarrito();
    }

    function renderCarrito() {
        const tbody = document.getElementById("carritoBody");
        tbody.innerHTML = "";
        let total = 0;

        carrito.forEach((item, index) => {
            total += item.subtotal;
            tbody.innerHTML += `
                <tr>
                    <td><strong>${item.producto}</strong></td>
                    <td>${item.sabor_base}</td>
                    <td>${item.tamano}</td>
                    <td>${item.fruta}</td>
                    <td>${item.topping_extra}</td>
                    <td class="text-center">${item.cantidad}</td>
                    <td class="text-right">$${item.precio.toFixed(2)}</td>
                    <td class="text-right">$${item.subtotal.toFixed(2)}</td>
                    <td class="text-center">
                        <button class="btn-delete" onclick="eliminarItem(${index})">❌</button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("totalDisplay").textContent = `TOTAL: $${total.toFixed(2)}`;
    }

    async function registrarEnGoogleSheets() {
        if (carrito.length === 0) {
            alert("El carrito está vacío.");
            return;
        }

        let reqVortices = 0;
        let reqGalletas = 0;
        let reqCroissants = 0;
        let reqPanMuerto = 0;

        carrito.forEach(item => {
            if (item.producto === "Vórtice") {
                reqVortices += (item.tamano === "Baby") ? (item.cantidad * 0.5) : (item.cantidad * 1);
            }
            if (item.producto === "Croissant") {
                reqCroissants += item.cantidad;
            }
            if (item.producto === "Pan de Muerto") {
                reqPanMuerto += item.cantidad;
            }
            if (item.producto === "Cookies Sandwich") {
                reqGalletas += (item.cantidad * 2);
            } else if (item.producto === "Sundae" && item.sabor_base === "Especial Cookie") {
                reqGalletas += (item.cantidad * 1);
            }

            if ((item.producto === "Vórtice" || item.producto === "Croissant" || item.producto === "Pan de Muerto") 
                && item.topping_extra.includes("Cookie (+20)")) {
                reqGalletas += (item.cantidad * 1);
            }
        });

        if (reqVortices > stockVortices) {
            alert(`Stock insuficiente de Vórtices. Requieres ${reqVortices} y dispones de ${stockVortices}.`);
            return;
        }
        if (reqGalletas > stockGalletas) {
            alert(`Stock insuficiente de Cookies. Requieres ${reqGalletas} y dispones de ${stockGalletas}.`);
            return;
        }
        if (reqCroissants > stockCroissants) {
            alert(`Stock insuficiente de Croissants. Requieres ${reqCroissants} y dispones de ${stockCroissants}.`);
            return;
        }
        if (reqPanMuerto > stockPanMuerto) {
            alert(`Stock insuficiente de Pan de Muerto. Requieres ${reqPanMuerto} y dispones de ${stockPanMuerto}.`);
            return;
        }

        const btnCobrar = document.getElementById("btnCobrar");
        btnCobrar.disabled = true;
        btnCobrar.textContent = "⏳ Guardando...";

        let totalVenta = carrito.reduce((acc, item) => acc + item.subtotal, 0);

        let payloadItems = carrito.map(item => ({
            producto: item.producto,
            variante: item.sabor_base,
            tamano: item.tamano,
            fruta: item.fruta,
            toppingExtra: item.topping_extra,
            cantidad: item.cantidad,
            precioUnitario: item.precio,
            subtotal: item.subtotal
        }));

        let payload = {
            metodoPago: document.getElementById("metodoPagoSelect").value,
            total: totalVenta,
            items: payloadItems,
            descuentoInventario: {
                reqVortices: reqVortices,
                reqGalletas: reqGalletas,
                reqCroissants: reqCroissants,
                reqPanMuerto: reqPanMuerto
            }
        };

        try {
            let res = await fetch(URL_GOOGLE_SHEETS, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload),
                redirect: "follow"
            });

            let data = await res.json();

            if (data.status === "success") {
                stockVortices -= reqVortices;
                stockGalletas -= reqGalletas;
                stockCroissants -= reqCroissants;
                stockPanMuerto -= reqPanMuerto;
                renderStock();

                alert(`✅ Venta registrada exitosamente.\n📋 ID Venta: ${data.numOrden ?? 'N/A'}`);
                carrito = [];
                renderCarrito();

                document.getElementById("productoSelect").value = "";
                alCambiarProducto();
            } else {
                alert("❌ Error en el servidor: " + (data.message || "Respuesta no exitosa"));
            }

        } catch (error) {
            alert("❌ Error al guardar la venta: " + error.message);
        } finally {
            btnCobrar.disabled = false;
            btnCobrar.textContent = "☁️ Cobrar y Guardar en Google Sheets";
        }
    }
