<!DOCTYPE html>
<lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Cafetería</title>
    <style>
        :root {
            --color1: #EDE4D3; /* Fondo suave */
            --color2: #C9B79C; /* Tarjetas y contenedores */
            --color3: #9C7A54; /* Acentos y bordes */
            --color4: #6B4F3A; /* Encabezados principales y botones */
            --color5: #3E2E22; /* Texto oscuro y contrastes */
            --danger: #b73a3a;
            --success: #3E2E22;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color1);
            color: var(--color5);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(62, 46, 34, 0.15);
            border: 2px solid var(--color2);
        }

        h1, h2 { 
            color: var(--color5); 
            margin-top: 0; 
            border-bottom: 2px solid var(--color3); 
            padding-bottom: 10px; 
        }
        h2 { font-size: 1.2rem; margin-top: 25px; margin-bottom: 15px; }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            background: var(--color1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--color2);
            margin-bottom: 20px;
        }

        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 0.85em; margin-bottom: 5px; color: var(--color5); }
        
        select, input, button { 
            padding: 8px; 
            border: 1px solid var(--color3); 
            border-radius: 6px; 
            font-size: 0.95rem; 
            background-color: #ffffff;
            color: var(--color5);
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--color4);
            box-shadow: 0 0 4px rgba(107, 79, 58, 0.4);
        }

        button { cursor: pointer; font-weight: bold; }

        .btn-add { 
            background-color: var(--color4); 
            color: var(--color1); 
            border: none; 
            align-self: flex-end; 
            padding: 10px; 
        }
        .btn-add:hover { background-color: var(--color5); }
        .btn-delete { background-color: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; }
        
        .btn-pay {
            background-color: var(--color5);
            color: var(--color1);
            border: none;
            font-size: 1.1rem;
            padding: 12px 20px;
            border-radius: 6px;
        }
        .btn-pay:hover {
            background-color: var(--color4);
        }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9rem; }
        th, td { padding: 10px; border-bottom: 1px solid var(--color2); text-align: left; }
        th { background-color: var(--color4); color: var(--color1); }
        .text-right { text-align: right; }
        .text-center { text-align: center; }

        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color1);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--color2);
            margin-bottom: 25px;
        }

        .total-display { font-size: 1.5rem; font-weight: bold; color: var(--color5); }
        .extra-options { display: contents; }

        /* Estilos Mini Inventario */
        .inventory-section {
            background: var(--color1);
            border: 1px solid var(--color2);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .inventory-card {
            background: #ffffff;
            border: 1px solid var(--color3);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(62, 46, 34, 0.08);
        }

        .inventory-card h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--color5);
        }

        .inventory-count {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--color4);
            text-align: center;
            margin: 5px 0;
        }

        .inventory-inputs {
            display: flex;
            gap: 8px;
        }

        .btn-update {
            background-color: var(--color4);
            color: var(--color1);
            border: none;
            padding: 8px;
            font-size: 0.85rem;
        }
        .btn-update:hover {
            background-color: var(--color5);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>vortice</h1>

    <!-- Formulario de Selección -->
    <div class="grid-form">
        <div class="form-group">
            <label>Producto / Categoría</label>
            <select id="productoSelect" onchange="alCambiarProducto()">
                <option value="">Selecciona...</option>
            </select>
        </div>

        <div class="form-group" id="groupVariante">
            <label id="labelVariante">Sabor / Tipo</label>
            <select id="varianteSelect" onchange="alCambiarVariante()"></select>
        </div>

        <!-- Opciones dinámicas para Vórtice -->
        <div id="vorticeExtras" class="extra-options" style="display:none;">
            <div class="form-group">
                <label>Tamaño</label>
                <select id="vorticeTamanoSelect">
                    <option value="Normal">Normal</option>
                    <option value="Mini">Mini</option>
                </select>
            </div>

            <div class="form-group">
                <label>Helado</label>
                <select id="vorticeHeladoSelect">
                    <option value="Con Helado">Con Helado</option>
                    <option value="Sin Helado">Sin Helado</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fruta</label>
                <select id="vorticeFrutaSelect">
                    <option value="Fresa">Fresa</option>
                    <option value="Durazno">Durazno</option>
                </select>
            </div>

            <div class="form-group">
                <label>Topping Superior</label>
                <select id="vorticeToppingSelect">
                    <option value="Nuez">Nuez</option>
                    <option value="Almendra">Almendra</option>
                    <option value="Chispas de Yogurth">Chispas de Yogurth</option>
                    <option value="Chispas de Chocolate">Chispas de Chocolate</option>
                    <option value="Galleta Lotus">Galleta Lotus</option>
                    <option value="Oreo">Oreo</option>
                    <option value="Chispas arcoiris">Chispas arcoiris</option>
                    <option value="Bombon">Bombon</option>
                    <option value="Sin topping">Sin topping</option>
                </select>
            </div>
        </div>

        <!-- Opciones dinámicas para Sundae -->
        <div id="sundaeExtras" class="extra-options" style="display:none;">
            <div class="form-group" id="groupSundaeFruta">
                <label>Fruta Incluida</label>
                <select id="sundaeFrutaSelect">
                    <option value="Sin fruta">Sin fruta</option>
                    <option value="Mango">Mango</option>
                    <option value="Fresa">Fresa</option>
                    <option value="Durazno">Durazno</option>
                </select>
            </div>

            <div class="form-group">
                <label>¿Fruta Extra? (+$10)</label>
                <select id="sundaeExtraFrutaSelect">
                    <option value="Ninguna">No</option>
                    <option value="Fresa">Fresa (+ $10.00)</option>
                    <option value="Mango">Mango (+ $10.00)</option>
                    <option value="Durazno">Durazno (+ $10.00)</option>
                </select>
            </div>

            <div class="form-group">
                <label>¿Extra Mermelada? (+$10)</label>
                <select id="sundaeExtraMermeladaSelect">
                    <option value="Ninguna">No</option>
                    <option value="Maracuyá">Maracuyá (+ $10.00)</option>
                    <option value="Fresa">Fresa (+ $10.00)</option>
                    <option value="Mango">Mango (+ $10.00)</option>
                    <option value="Moras">Moras (+ $10.00)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Topping Extra (+$10)</label>
                <select id="sundaeToppingSelect">
                    <option value="Ninguno">Ninguno</option>
                    <option value="Nuez">Nuez (+ $10.00)</option>
                    <option value="Almendra">Almendra (+ $10.00)</option>
                    <option value="Chispas de Yogurth">Chispas de Yogurth (+ $10.00)</option>
                    <option value="Chispas de Chocolate">Chispas de Chocolate (+ $10.00)</option>
                    <option value="Galleta Lotus">Galleta Lotus (+ $10.00)</option>
                    <option value="Oreo">Oreo (+ $10.00)</option>
                    <option value="Chispas arcoiris">Chispas arcoiris (+ $10.00)</option>
                    <option value="Bombon">Bombon (+ $10.00)</option>
                </select>
            </div>
        </div>

        <!-- Opciones dinámicas para Cookies Sandwich -->
        <div id="cookieExtras" class="extra-options" style="display:none;">
            <div class="form-group">
                <label>Topping Extra</label>
                <select id="cookieToppingSelect">
                    <option value="Ninguno">Ninguno</option>
                    <option value="Nuez">Nuez</option>
                    <option value="Almendra">Almendra</option>
                    <option value="Chispas de Yogurth">Chispas de Yogurth</option>
                    <option value="Chispas de Chocolate">Chispas de Chocolate</option>
                    <option value="Galleta Lotus">Galleta Lotus</option>
                    <option value="Oreo">Oreo</option>
                    <option value="Chispas arcoiris">Chispas arcoiris</option>
                    <option value="Bombon">Bombon</option>
                </select>
            </div>
        </div>

        <!-- Opciones dinámicas para Conos -->
        <div id="conoExtras" class="extra-options" style="display:none;">
            <div class="form-group">
                <label>Topping</label>
                <select id="conoToppingSelect">
                    <option value="Sin topping">Sin topping</option>
                    <option value="Nuez">Nuez</option>
                    <option value="Almendra">Almendra</option>
                    <option value="Chispas de Yogurth">Chispas de Yogurth</option>
                    <option value="Chispas de Chocolate">Chispas de Chocolate</option>
                    <option value="Galleta Lotus">Galleta Lotus</option>
                    <option value="Oreo">Oreo</option>
                    <option value="Chispas arcoiris">Chispas arcoiris</option>
                    <option value="Bombon">Bombon</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Cantidad</label>
            <input type="number" id="cantidadInput" value="1" min="1">
        </div>

        <button class="btn-add" onclick="agregarAlCarrito()">+ Agregar</button>
    </div>

    <!-- Carrito de Compras -->
    <h2>Orden Actual</h2>
    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Detalles / Especificaciones</th>
                <th class="text-center">Cant.</th>
                <th class="text-right">P. Unit.</th>
                <th class="text-right">Subtotal</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody id="carritoTabla">
            <!-- Filas dinámicas -->
        </tbody>
    </table>

    <!-- Barra del Total y Pago -->
    <div class="summary-bar">
        <div class="form-group" style="margin: 0; min-width: 200px;">
            <label>Método de Pago</label>
            <select id="metodoPagoSelect">
                <option value="Efectivo">Efectivo</option>
                <option value="Tarjeta / Transferencia">Tarjeta / Transferencia</option>
            </select>
        </div>
        
        <div class="total-display">
            Total: $<span id="totalDisplay">0.00</span>
        </div>

        <button class="btn-pay" onclick="registrarVenta()">Finalizar Venta</button>
    </div>

    <!-- Sección Mini Inventario -->
    <div class="inventory-section">
        <h2>Mini Inventario Base</h2>
        <div class="inventory-grid">
            <div class="inventory-card">
                <h3>Base para Helado (Liters/Unidades)</h3>
                <div class="inventory-count" id="invBaseHelado">100</div>
                <div class="inventory-inputs">
                    <input type="number" id="inputBaseHelado" placeholder="+ Cantidad" min="1">
                    <button class="btn-update" onclick="actualizarInventario('BaseHelado')">Añadir</button>
                </div>
            </div>

            <div class="inventory-card">
                <h3>Conos (Piezas)</h3>
                <div class="inventory-count" id="invConos">50</div>
                <div class="inventory-inputs">
                    <input type="number" id="inputConos" placeholder="+ Cantidad" min="1">
                    <button class="btn-update" onclick="actualizarInventario('Conos')">Añadir</button>
                </div>
            </div>

            <div class="inventory-card">
                <h3>Galletas / Sandwiches (Piezas)</h3>
                <div class="inventory-count" id="invGalletas">40</div>
                <div class="inventory-inputs">
                    <input type="number" id="inputGalletas" placeholder="+ Cantidad" min="1">
                    <button class="btn-update" onclick="actualizarInventario('Galletas')">Añadir</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // URL de despliegue de Google Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9QatR2K-8IVLvqaiWgLvO_NQ-Y-E5z-klcxxAExs4SRiwcy-tPAcWRXWCapQTiA82/exec";

    // Catálogo de Productos y Precios Base
    const catalogo = {
        "Vórtice": {
            precios: { "Normal": 65, "Mini": 45 },
            variantes: ["Moka", "Matcha", "Chai", "Taro", "Chocolate", "Café"]
        },
        "Sundae": {
            precios: { "Sencillo": 50, "Especial": 60 },
            variantes: ["Maracuyá", "Fresa", "Mango", "Moras"]
        },
        "Cookie Sandwich": {
            precios: { "Estándar": 40 },
            variantes: ["Chocochips", "Doble Chocolate", "Red Velvet"]
        },
        "Cono": {
            precios: { "Sencillo": 30, "Doble": 45 },
            variantes: ["Vainilla", "Chocolate", "Mixto"]
        }
    };

    let carrito = [];
    let inventario = {
        BaseHelado: 100,
        Conos: 50,
        Galletas: 40
    };

    // Cargar catálogo inicial en los selectores
    window.onload = function() {
        const pSelect = document.getElementById("productoSelect");
        for (let prod in catalogo) {
            let opt = document.createElement("option");
            opt.value = prod;
            opt.textContent = prod;
            pSelect.appendChild(opt);
        }
    };

    function alCambiarProducto() {
        const prod = document.getElementById("productoSelect").value;
        const vSelect = document.getElementById("varianteSelect");
        vSelect.innerHTML = "";

        // Ocultar todos los extras
        document.getElementById("vorticeExtras").style.display = "none";
        document.getElementById("sundaeExtras").style.display = "none";
        document.getElementById("cookieExtras").style.display = "none";
        document.getElementById("conoExtras").style.display = "none";

        if (!prod) return;

        // Cargar variantes del producto
        catalogo[prod].variantes.forEach(v => {
            let opt = document.createElement("option");
            opt.value = v;
            opt.textContent = v;
            vSelect.appendChild(opt);
        });

        // Mostrar sección de opciones correspondientes
        if (prod === "Vórtice") document.getElementById("vorticeExtras").style.display = "contents";
        if (prod === "Sundae") document.getElementById("sundaeExtras").style.display = "contents";
        if (prod === "Cookie Sandwich") document.getElementById("cookieExtras").style.display = "contents";
        if (prod === "Cono") document.getElementById("conoExtras").style.display = "contents";
    }

    function alCambiarVariante() {
        // Reservado para lógica adicional basada en sabor/variante
    }

    function agregarAlCarrito() {
        const producto = document.getElementById("productoSelect").value;
        const variante = document.getElementById("varianteSelect").value;
        const cantidad = parseInt(document.getElementById("cantidadInput").value);

        if (!producto || !variante || cantidad <= 0) {
            alert("Por favor selecciona un producto, variante y cantidad válida.");
            return;
        }

        let precioUnitario = 0;
        let detalles = [];

        if (producto === "Vórtice") {
            const tamano = document.getElementById("vorticeTamanoSelect").value;
            const helado = document.getElementById("vorticeHeladoSelect").value;
            const fruta = document.getElementById("vorticeFrutaSelect").value;
            const topping = document.getElementById("vorticeToppingSelect").value;

            precioUnitario = catalogo["Vórtice"].precios[tamano];
            detalles.push(`Sabor: ${variante}`, `Tamaño: ${tamano}`, helado, `Fruta: ${fruta}`, `Topping: ${topping}`);
        } 
        else if (producto === "Sundae") {
            const frutaInc = document.getElementById("sundaeFrutaSelect").value;
            const extraFruta = document.getElementById("sundaeExtraFrutaSelect").value;
            const extraMermelada = document.getElementById("sundaeExtraMermeladaSelect").value;
            const extraTopping = document.getElementById("sundaeToppingSelect").value;

            precioUnitario = catalogo["Sundae"].precios["Sencillo"];
            detalles.push(`Sabor: ${variante}`);

            if (frutaInc !== "Sin fruta") detalles.push(`Fruta: ${frutaInc}`);
            if (extraFruta !== "Ninguna") { precioUnitario += 10; detalles.push(`Extra Fruta: ${extraFruta}`); }
            if (extraMermelada !== "Ninguna") { precioUnitario += 10; detalles.push(`Extra Mermelada: ${extraMermelada}`); }
            if (extraTopping !== "Ninguno") { precioUnitario += 10; detalles.push(`Extra Topping: ${extraTopping}`); }
        } 
        else if (producto === "Cookie Sandwich") {
            const topping = document.getElementById("cookieToppingSelect").value;
            precioUnitario = catalogo["Cookie Sandwich"].precios["Estándar"];
            detalles.push(`Galleta: ${variante}`);
            if (topping !== "Ninguno") detalles.push(`Topping: ${topping}`);
        } 
        else if (producto === "Cono") {
            const topping = document.getElementById("conoToppingSelect").value;
            precioUnitario = catalogo["Cono"].precios["Sencillo"];
            detalles.push(`Sabor: ${variante}`);
            if (topping !== "Sin topping") detalles.push(`Topping: ${topping}`);
        }

        const subtotal = precioUnitario * cantidad;

        carrito.push({
            producto,
            variante,
            detalles: detalles.join(" | "),
            cantidad,
            precioUnitario,
            subtotal
        });

        renderizarCarrito();
    }

    function eliminarDelCarrito(index) {
        carrito.splice(index, 1);
        renderizarCarrito();
    }

    function renderizarCarrito() {
        const tbody = document.getElementById("carritoTabla");
        tbody.innerHTML = "";
        let total = 0;

        carrito.forEach((item, index) => {
            total += item.subtotal;
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td><b>${item.producto}</b></td>
                <td><small>${item.detalles}</small></td>
                <td class="text-center">${item.cantidad}</td>
                <td class="text-right">$${item.precioUnitario.toFixed(2)}</td>
                <td class="text-right">$${item.subtotal.toFixed(2)}</td>
                <td class="text-center">
                    <button class="btn-delete" onclick="eliminarDelCarrito(${index})">X</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById("totalDisplay").textContent = total.toFixed(2);
    }

    function registrarVenta() {
        if (carrito.length === 0) {
            alert("El carrito está vacío.");
            return;
        }

        const metodoPago = document.getElementById("metodoPagoSelect").value;
        const totalVenta = parseFloat(document.getElementById("totalDisplay").textContent);

        const ventaPayload = {
            fecha: new Date().toISOString(),
            metodoPago: metodoPago,
            total: totalVenta,
            items: carrito
        };

        // Enviar datos a Google Sheets mediante la Web App
        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ventaPayload)
        })
        .then(() => {
            alert("Venta registrada con éxito.");
            carrito = [];
            renderizarCarrito();
        })
        .catch(err => {
            console.error("Error al registrar venta:", err);
            alert("Ocurrió un error al conectar con Google Sheets.");
        });
    }

    function actualizarInventario(item) {
        const input = document.getElementById(`input${item}`);
        const cantidadAñadir = parseInt(input.value);

        if (isNaN(cantidadAñadir) || cantidadAñadir <= 0) {
            alert("Ingresa un número válido para agregar al inventario.");
            return;
        }

        inventario[item] += cantidadAñadir;
        document.getElementById(`inv${item}`).textContent = inventario[item];
        input.value = "";
    }
</script>

</body>
</html>
